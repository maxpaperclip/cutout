name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the committed root HTML and site/ match a fresh build
        run: |
          if ! diff -q dist/Cutout.html Cutout.html; then
            echo "::error::The committed root HTML file is out of date. Run 'npm run release' and commit the result."
            exit 1
          fi
          if ! diff -rq dist/site site; then
            echo "::error::The committed site/ folder is out of date. Run 'npm run release' and commit the result."
            exit 1
          fi

      - name: Run unit tests
        run: npm test
