name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the code; it never needs to write to the repository
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the committed root HTML and site/ match a fresh build
        run: |
          if ! diff -q dist/FriendShaped.html FriendShaped.html; then
            echo "::error::The committed root HTML file is out of date. Run 'npm run release' and commit the result."
            exit 1
          fi
          if ! diff -rq dist/site site; then
            echo "::error::The committed site/ folder is out of date. Run 'npm run release' and commit the result."
            exit 1
          fi

      - name: Run unit tests
        run: npm test
